name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write # tags y commits del PR Version Packages (changesets/action)
  pull-requests: write # creacion y actualizacion del PR Version Packages

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version Packages o publicacion de tags
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Crear PR Version Packages o publicar tags
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm changeset:version
          publish-script: pnpm release
          commit-message: "Version Packages"
          pr-title: "Version Packages"
          push-git-tags: true
          create-github-releases: false
