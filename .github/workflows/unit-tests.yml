name: Tests unitarios

on:
  pull_request:
    branches:
      - main
      - master
      - dev
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-unit:
    name: Ejecutar suite de tests unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar scripts bootstrap de base de datos
        run: pnpm db:scripts:validate

      - name: Validar que el estado documental de apps este actualizado
        run: pnpm docs:sync-app-status && git diff --exit-code -- docs/00-General/04-Listado-de-Aplicaciones.md docs/02-Aplicaciones/00-README.md

      - name: Ejecutar tests unitarios con umbrales de cobertura
        run: pnpm test:unit
