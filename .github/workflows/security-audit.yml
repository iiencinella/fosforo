name: Auditoria de dependencias

on:
  pull_request:
    branches:
      - main
      - master
      - dev
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pnpm audit (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bloqueante desde el 2026-08-26: los overrides de chore/audit-overrides
    # dejaron el inventario --prod en cero vulnerabilidades.
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Auditar vulnerabilidades high y critical
        run: pnpm audit --prod --audit-level high
