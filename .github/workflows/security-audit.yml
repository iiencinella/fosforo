name: Auditoria de dependencias

on:
  pull_request:
    branches:
      - main
      - master
      - dev
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pnpm audit (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No bloqueante mientras se remedian las vulnerabilidades preexistentes
    # del arbol (55 al 2026-08-21). Pasar a bloqueante quitando
    # continue-on-error cuando el inventario llegue a cero high/critical.
    continue-on-error: true

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Auditar vulnerabilidades high y critical
        run: pnpm audit --prod --audit-level high
