<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  
  <!-- Decorative cross -->
  <g transform="translate(600, 200)" opacity="0.1">
    <rect x="-2" y="-80" width="4" height="160" fill="#f59e0b" />
    <rect x="-40" y="-42" width="80" height="4" fill="#f59e0b" />
  </g>
  
  <!-- Logo area -->
  <g transform="translate(600, 280)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="72" fill="#f59e0b" text-anchor="middle" font-weight="bold">Biblia</text>
    <text x="0" y="50" font-family="Georgia, serif" font-size="24" fill="#94a3b8" text-anchor="middle">Fósforo</text>
  </g>
  
  <!-- Tagline -->
  <g transform="translate(600, 420)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle">La Palabra de Dios, cada día.</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)" />
</svg>
