packages:
  - "src/apps/*"
  - "src/mobile/*"
  - "src/desktop/*"
  - "src/packages/*"

# Catalogo de dependencias compartidas.
# Versiones EXACTAS: una sola fuente de verdad para todo el monorepo.
# Para actualizar: cambiar aca y correr pnpm install.
catalog:
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@tailwindcss/cli": 4.3.3
  "@supabase/supabase-js": 2.112.4
  zod: 4.4.3
  marked: 16.0.0
  sanitize-html: 2.17.0
  "@types/sanitize-html": 2.16.0
  turbo: 2.10.11
  "@types/node": 24.13.3
  "@astrojs/check": 0.9.10
  astro: 7.2.4
  sharp: 0.35.3
  "@astrojs/react": 6.0.4
  "@astrojs/vercel": 11.0.7
  typescript: 6.0.3
  vitest: 4.1.11
  "@vitest/coverage-v8": 4.1.11

# Settings de pnpm (antes en el campo "pnpm" del package.json; pnpm 12 ya no lo lee).
# Docs: https://pnpm.io/settings
overrides:
  tar: ">=7.5.21"
  svgo: ">=4.0.2"
  "@babel/core": "7.29.7"

packageExtensions:
  "@tailwindcss/cli@*":
    dependencies:
      mri: "^1.2.0"

# pnpm 12: los scripts de build de dependencias requieren revision explicita
# (strictDepBuilds). Antes (pnpm 10, onlyBuiltDependencies) solo corria electron
# y estos dos quedaban ignorados; se mantiene ese comportamiento sin ejecutar
# sus scripts: ambos funcionan con los binarios prebuilt.
allowBuilds:
  esbuild: false
  "@parcel/watcher": false

patchedDependencies:
  "@astrojs/internal-helpers@0.10.4": patches/@astrojs__internal-helpers@0.10.4.patch
